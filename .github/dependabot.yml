version: 2
updates:
  
  # Configuration for GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  # Configuration for Rust dependencies managed by Cargo
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
  
  # Configuration for Rust dependencies managed by rust-toolchain
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  # Configuration for Docker dependencies
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
