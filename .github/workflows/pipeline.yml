name: Pipeline

# Default to read-only. Jobs that genuinely need to push (lint-and-test
# auto-fixes formatting, update-hosts commits hosts.txt) opt in explicitly with
# their own `permissions:` block. Keeping the default minimal means a job that
# is added later — or a dependency action that turns malicious — cannot write to
# the repository unless it was granted that power on purpose.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: LINT & TEST — push / PR / dispatch
  # Fast feedback: no Docker, no network calls.
  # ─────────────────────────────────────────────
  lint-and-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # This job auto-commits formatting fixes on push, so it needs write access.
    # It never pushes on pull_request (the commit step is gated on `push`), so a
    # PR from a fork cannot make this job write to the repo.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # The toolchain is part of the cache key: a new pinned version must not
          # reuse artifacts compiled by the previous one.
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}

      - name: Lint and fix Markdown
        uses: rvben/rumdl@v0.2.78
        with:
          path: '**/*.md'
          command: fmt

      - name: Run cargo fmt
        run: cargo fmt --all

      - name: Commit and push formatting fixes
        if: github.event_name == 'push'
        run: |
          export GIT_MERGE_AUTOEDIT=no
          export GIT_TERMINAL_PROMPT=0
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Auto-fix formatting (cargo fmt)"
            git pull --rebase --no-edit origin "$BRANCH_NAME"
            git push origin "HEAD:refs/heads/$BRANCH_NAME"
          else
            echo "No formatting changes to commit."
          fi

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Run doc tests
        run: cargo test --locked --doc

  # ─────────────────────────────────────────────
  # JOB 2: DOCKER BUILD CHECK — push to main + dispatch only
  # Skipped on PRs to save CI minutes.
  # ─────────────────────────────────────────────
  docker-build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image with GHA Cache
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: adblock2mikrotik_rust:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image — binary runs, no network
        run: |
          docker run --rm --network none adblock2mikrotik_rust:ci-test --version

  # ─────────────────────────────────────────────
  # JOB 3: UPDATE HOSTS — schedule + dispatch
  # ─────────────────────────────────────────────
  update-hosts:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # This job commits the regenerated hosts.txt back to main.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}

      - name: Run conversion
        # --release: the job compiles from a restored cache either way, and the
        # release build uses less CPU on the conversion itself,
        # so debug only makes this run slower, not cheaper.
        run: cargo run --locked --release

      - name: Commit and push hosts.txt
        run: |
          if [[ -n $(git status --porcelain hosts.txt) ]]; then
            git add hosts.txt
            git commit -m "Update hosts.txt via schedule"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit."
          fi