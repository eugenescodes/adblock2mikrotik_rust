[package]
name = "adblock2mikrotik_rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
encoding_rs = "0.8.42"
reqwest = "0.13.5"
chrono = "0.4.45"
anyhow = "1.0.104"
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
mockito = "1.7.2"
tempfile = "3.27.0"
tokio = { version = "1.53", default-features = false, features = ["test-util"] }
